<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - MohAcademy</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="manifest" href="/images/site.webmanifest">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --primary-color: #007bff;
            --primary-dark: #0056b3;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --neon-green: #2ecc71;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #f4f7fc 0%, #e2e8f0 100%);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-container-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        .auth-glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            width: 100%;
            max-width: 520px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            text-align: center;
            box-sizing: border-box;
            animation: formFadeIn 0.5s ease-out;
        }

        .shield-icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(0, 123, 255, 0.1);
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 20px;
        }

        .auth-header-node h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, var(--text-dark) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-header-node p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .otp-digits-flex-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 15px 0 25px 0;
        }

        .otp-input-node {
            width: 56px;
            height: 64px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            text-align: center;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .otp-input-node:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.12);
            background-color: #fafafa;
        }

        .auth-input-group {
            text-align: left;
            margin-bottom: 25px;
            position: relative;
        }

        .auth-input-group label {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-field-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-icon-wrapper i.field-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .input-field-icon-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #ffffff;
            font-family: 'Lato', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            outline: none;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        .input-field-icon-wrapper input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.12);
        }

        .toggle-password-visibility {
            position: absolute;
            right: 16px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .auth-action-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.2);
            transition: all 0.25s;
        }

        .auth-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 123, 255, 0.3);
        }

        @keyframes formFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 576px) {
            .auth-glass-card { padding: 35px 16px; }
            .otp-input-node { width: 42px; height: 54px; font-size: 1.3rem; }
            .auth-header-node h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <header class="header" id="main-header">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <i class="fas fa-atom logo-icon"></i> <span class="site-name">MohAcademy</span>
            </a>
            <nav class="nav-menu">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="subjects.html" class="nav-link">Subjects</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="auth-container-wrapper">
        <div class="auth-glass-card">
            <div class="shield-icon-wrapper">
                <i class="fas fa-key"></i>
            </div>
            
            <div class="auth-header-node">
                <h1>Set New Password</h1>
                <p>Enter the 6-digit recovery code sent to your email alongside your new secure credentials.</p>
            </div>

            <form id="resetPasswordForm" onsubmit="handlePasswordReset(event)">
                
                <div class="otp-digits-flex-row" id="otp_inputs_wrapper">
                    <input type="text" maxlength="1" class="otp-input-node" required pattern="[0-9]">
                    <input type="text" maxlength="1" class="otp-input-node" required pattern="[0-9]">
                    <input type="text" maxlength="1" class="otp-input-node" required pattern="[0-9]">
                    <input type="text" maxlength="1" class="otp-input-node" required pattern="[0-9]">
                    <input type="text" maxlength="1" class="otp-input-node" required pattern="[0-9]">
                    <input type="text" maxlength="1" class="otp-input-node" required pattern="[0-9]">
                </div>

                <div class="auth-input-group">
                    <label>New Secure Password</label>
                    <div class="input-field-icon-wrapper">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" placeholder="••••••••" required id="new_password">
                        <i class="fas fa-eye toggle-password-visibility" onclick="toggleFieldMask('new_password', this)"></i>
                    </div>
                </div>

                <button type="submit" class="auth-action-btn">Update Security Profile</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-column footer-about">
                <a href="index.html" class="logo footer-logo">
                    <i class="fas fa-atom logo-icon"></i> <span class="site-name">MohAcademy</span>
                </a>
                <p>Your premium gateway toward mastering GCE Advanced Level Science criteria.</p>
            </div>
            <div class="footer-bottom">
                <div class="container">
                    <p>&copy; 2026 MohAcademy. Made for Science Students.</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const inputContainer = document.getElementById('otp_inputs_wrapper');
            const fields = inputContainer.querySelectorAll('.otp-input-node');

            fields.forEach((field, index) => {
                field.addEventListener('input', (e) => {
                    if (field.value.length >= 1 && index < fields.length - 1) {
                        fields[index + 1].focus();
                    }
                });
                field.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && field.value.length === 0 && index > 0) {
                        fields[index - 1].focus();
                    }
                });
            });
        });

        function toggleFieldMask(targetId, iconRef) {
            const field = document.getElementById(targetId);
            if(field.type === "password") {
                field.type = "text";
                iconRef.className = "fas fa-eye-slash toggle-password-visibility";
            } else {
                field.type = "password";
                iconRef.className = "fas fa-eye toggle-password-visibility";
            }
        }

        async function handlePasswordReset(e) {
            e.preventDefault();
            
            const inputs = document.querySelectorAll('.otp-input-node');
            let otpCode = "";
            inputs.forEach(input => otpCode += input.value);

            const newPassword = document.getElementById('new_password').value;
            const email = localStorage.getItem('reset_target_email');

            if(!email) {
                alert("Session expired. Please request a new code.");
                window.location.href = "forgot-password.html";
                return;
            }

            const btn = e.target.querySelector('.auth-action-btn');
            const originalText = btn.innerText;
            btn.innerText = "Processing Update...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp: otpCode, newPassword })
                });

                const data = await response.json();

                if (response.status === 200) {
                    alert("Password updated successfully! Please log in with your new credentials.");
                    localStorage.removeItem('reset_target_email');
                    window.location.href = "login.html";
                } else {
                    alert(`Reset Error: ${data.message}`);
                }
            } catch (error) {
                console.error("Connection failed:", error);
                alert("Fatal Error: Could not reach the server.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
